name: Shell syntax check

on:
  workflow_dispatch:
  push:
    paths:
      - "*.sh"
      - "debian.cfg"
      - ".github/workflows/run_reinstall.yml"
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n reinstall.sh
          bash -n trans.sh
          bash -n debian.cfg
